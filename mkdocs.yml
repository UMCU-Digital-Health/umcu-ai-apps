site_name: UMCU AI Apps
site_description: Documentatie voor de apps van het UMC Utrecht AI-team
site_author: UMCU Team AI

theme:
  name: material
  language: nl
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - Gebruikershandleiding:
      - LLM Evaluatie Applicatie: user-guide/llm-evaluation.md
