version = 1
disable_existing_loggers = false

[formatters.plain]
format = "%(levelname)s: [%(name)s] - %(message)s"

[handlers.package_console]
class = "logging.StreamHandler"
level = "NOTSET"
formatter = "plain"
stream = "ext://sys.stdout"

[handlers.third_party_console]
class = "logging.StreamHandler"
level = "INFO"
formatter = "plain"
stream = "ext://sys.stdout"

[loggers.umcu_ai_apps]
level = "INFO"
handlers = ["package_console"]
propagate = false

[root]
level = "INFO"
handlers = ["third_party_console"]